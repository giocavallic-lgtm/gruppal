<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta
      name="description"
      content="Crewzy: planes, gastos compartidos y apuestas privadas con tus amigos y familia."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Crewzy" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Crewzy</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('crewzy-store');
          var state = raw ? JSON.parse(raw).state || {} : {};
          var theme = state.theme || 'system';
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var color = document.querySelector('meta[name="theme-color"]');
          if (color) color.setAttribute('content', dark ? '#0a0a0b' : '#f2f2f5');
          var status = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (status) status.setAttribute('content', dark ? 'black-translucent' : 'default');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
